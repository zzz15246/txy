<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>生日快乐 田香雨</title>

        font-family: "Microsoft Yahei", "PingFang SC", sans-serif;

        overflow: hidden;

        color: #222;

        color: #d86b8f;
        margin-bottom: 20px;
        font-weight: 300;
        opacity: 0.85;
        z-index: 2;
    }

    .start-number {
        font-size: 230px;
        font-weight: 900;
        color: #ffffff;
        line-height: 1;
        text-shadow: 0 12px 34px rgba(255, 100, 150, 0.45),
                     0 0 24px rgba(255, 255, 255, 0.6);
        letter-spacing: 10px;
        z-index: 2;
    }

    .start-subtitle {
        margin-top: 26px;
        font-size: 20px;
        color: #222;
        letter-spacing: 2px;
        opacity: 0.9;
        z-index: 2;
    }

    .start-subtitle .keyword {
        color: #ff4d79;
        font-weight: bold;
    }

    .start-hint {
        margin-top: 42px;
        font-size: 13px;
        color: #555;
        opacity: 0.75;
        letter-spacing: 3px;
        z-index: 2;
    }

    .start-wishes {
        margin-top: 24px;
        text-align: center;
        z-index: 2;
    }

    .start-wishes p {
        font-size: 14px;
        color: #555;
        line-height: 1.9;
        letter-spacing: 1px;
    }

    .start-wishes .en {
        font-size: 13px;
        color: #ff4d79;
        margin-top: 8px;
        letter-spacing: 2px;
    }

    /* ========== 礼物页 ========== */
    #page2 {
        background: linear-gradient(135deg, #fef4f9 0%, #fcdceb 100%);
        flex-direction: row;
        justify-content: space-around;
        align-items: center;
        gap: 40px;
        padding: 60px;
    }

    .gift-left {
        display: flex;
        flex-direction: column;
        gap: 30px;
        text-align: left;
    }

    .gift-title-line1 {
        font-size: 72px;
        font-weight: 900;
        color: #222;
        line-height: 1.1;
    }

    .gift-title-line1 .keyword {
        color: #ff4d79;
    }

    .gift-title-line2 {
        font-size: 72px;
        font-weight: 900;
        color: #ff4d79;
        line-height: 1.1;
    }

    .gift-right {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
    }

    .gift-number {
        font-size: 260px;
        font-weight: 900;
        color: #ffffff;
        line-height: 1;
        text-shadow: 0 12px 40px rgba(255, 100, 150, 0.45),
                     0 0 24px rgba(255, 255, 255, 0.6);
        letter-spacing: 10px;
    }

    #openGiftBtn {
        padding: 16px 42px;
        font-size: 20px;
        border: none;
        border-radius: 99px;
        background: #ff4d79;
        color: #fff;
        cursor: pointer;
        letter-spacing: 4px;
        box-shadow: 0 10px 24px rgba(255, 100, 150, 0.35);
        transition: 0.3s;
    }

    #openGiftBtn:hover {
        transform: scale(1.06);
        background: #ff3366;
    }

    /* ========== 照片墙页 ========== */
    #page3 {
        background: #fef4f9;
        overflow: auto;
    }

    .photo-title {
        font-size: 28px;
        margin-bottom: 16px;
        color: #222;
    }

    .photo-title .keyword {
        color: #ff4d79;
    }

    .upload-area {
        margin-bottom: 20px;
        color: #555;
        text-align: center;
    }

    .heart-wall {
        position: relative;
        width: 900px;
        height: 620px;
        margin: 0 auto 24px;
    }

    .heart-item {
        position: absolute;
        width: 82px;
        height: 82px;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(255, 100, 150, 0.22);
        transition: 0.35s ease;
        border: 3px solid #fff;
    }

    .heart-item:hover {
        transform: scale(1.14);
        z-index: 10;
    }

    .heart-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .next-page3 {
        margin-top: 10px;
        padding: 12px 30px;
        border-radius: 30px;
        background: #ff4d79;
        border: none;
        color: #fff;
        font-size: 18px;
        cursor: pointer;
    }

    /* ========== 蛋糕页 ========== */
    #page4 {
        background: linear-gradient(180deg, #fef4f9 0%, #fcdceb 100%);
    }

    .cake-scene {
        position: relative;
        width: 340px;
        height: 400px;
        margin-bottom: 20px;
    }

    .cake-box {
        position: absolute;
        left: 50%;
        top: 40px;
        transform: translateX(-50%);
        width: 320px;
        height: 340px;
    }

    .cake-layer {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 50% 50% 0 0;
        background: #f8c8dc;
    }

    .layer1 {
        width: 320px;
        height: 110px;

    .layer2 {

        background: #f8c8dc;
    }

    .layer3 {

        height: 90px;

    .cake-decoration {
        position: absolute;

    .deco-cherry {
        top: 175px;

        font-size: 20px;
    }

    .deco-cherry-2 {
        top: 175px;
        left: 70%;

    }

    .deco-star {

    .deco-heart {

    .deco-heart-2 {

        bottom: 275px;

        height: 32px;

        width: 10px;
        height: 16px;
        background: radial-gradient(#ffdd00, #ff6622);
        border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        position: absolute;
        top: -14px;
        left: -2px;
        animation: flame 0.4s infinite alternate;
    }

    @keyframes flame {
        0% {
            transform: scaleY(1);
            opacity: 0.9;
        }
        100% {
            transform: scaleY(1.15);
            opacity: 1;
        }
    }

    .flame.out {
        display: none;
    }

    .wish-text {
        font-size: 22px;
        margin: 20px 0;
        text-align: center;
        line-height: 1.7;
        color: #222;
    }

    .wish-text .keyword {
        color: #ff4d79;
        font-weight: bold;
    }

    .wish-en {

    #wishBtn {

    #gameNext {

        cursor: pointer;

    /* ========== 视频页 ========== */
    #page6 {

    }

    .video-title {

    #myVideo {

    .next-page6 {
        margin-top: 22px;
        padding: 10px 26px;
        border-radius: 30px;
        background: #ff4d79;
        border: none;
        color: #fff;

    #page7 {

    }

    .sign-title {
        font-size: 26px;
        margin-bottom: 16px;
        color: #222;
    }

    .sign-title .keyword {

    }

    .sign-wall {
        margin-top: 30px;
        display: grid;
        grid-template-columns: repeat(10, 1fr);

        width: 400px;
        height: 480px;
    }

    .sign-cell {
        border: 1px solid rgba(255, 77, 121, 0.45);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: #222;
        min-height: 40px;
    }
    .next-page7{
        margin-top:24px;
        padding:10px 26px;
        border-radius:30px;
        background:#ff4d79;
        border:none;
        color:#fff;
        font-size:17px;
        cursor:pointer;
    }

    /* ========== 密码祝福页 ========== */
    #page8 {
        background: linear-gradient(180deg, #fef4f9 0%, #ffd1e8 100%);
        justify-content: center;
        padding: 30px 20px 40px;
    }

    .final-title {
        font-size: 28px;
        margin-bottom: 20px;
        color: #222;
        text-align: center;
    }

    .final-title .keyword {
        color: #ff4d79;
        font-weight: bold;
    }

    .final-question {
        font-size: 20px;
        margin-bottom: 16px;
        color: #222;
        text-align: center;
    }

    .final-input {
        width: 260px;
        height: 44px;
        border-radius: 24px;
        border: 1px solid #ff4d79;
        padding: 0 16px;
        font-size: 16px;
        text-align: center;
        outline: none;
        margin-bottom: 16px;
    }

    .final-btn {
        padding: 12px 30px;
        border-radius: 30px;
        background: #ff4d79;
        border: none;
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        margin-bottom: 20px;
    }

    .final-result {
        max-width: 420px;

        padding: 20px;
        border-radius: 16px;
        background: rgba(255, 77, 121, 0.08);
        border: 1px solid rgba(255, 77, 121, 0.3);
        color: #222;

        line-height: 1.9;
        text-align: center;

    .final-result .keyword {

    }

    .final-error {
        color: #ff4d79;
        font-size: 16px;
        margin-top: 10px;
        display: none;
    }
</style>
</head>

<body>
<canvas id="fireCanvas"></canvas>

<!-- 第1页：开场烟花页 -->
<div class="page active" id="page1">
    <div class="start-english">FOR TIANXIANGYU</div>

        <div class="gift-title-line1"><span class="keyword">田香雨</span>，</div>
        <div class="gift-title-line2">生日快乐</div>
    </div>
    <div class="gift-right">
        <div class="gift-number">20</div>

        </div>
        <div class="cake-decoration deco-star">⭐</div>
        <div class="cake-decoration deco-cherry">🍒</div>
        <div class="cake-decoration deco-cherry-2">🍒</div>

<!-- 第8页：密码祝福页 -->

    <button class="final-btn" onclick="checkFinalAnswer()">确认</button>
    <div class="final-result" id="finalResult"></div>
    <div class="final-error" id="finalError">答案错误，请再试一次。</div>

<script>
// ========== 开场页烟花：只在第一页使用，只播放一次 ==========
const canvas = document.getElementById('fireCanvas');
const ctx = canvas.getContext('2d');
let w, h;
let animationId = null;
let fireworks = [];
let particles = [];
let fireworkRunning = false;
let fireTimer = null;
let hasFireworkFired = false;

function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
}

resize();
window.addEventListener('resize', resize);

const fireworkPalettes = [
    { main: 'hsl(350, 100%, 72%)', glow: 'hsl(350, 100%, 82%)' },
    { main: 'hsl(280, 100%, 78%)', glow: 'hsl(280, 100%, 88%)' },
    { main: 'hsl(200, 100%, 74%)', glow: 'hsl(200, 100%, 84%)' },
    { main: 'hsl(45, 100%, 70%)', glow: 'hsl(45, 100%, 80%)' },
    { main: 'hsl(320, 100%, 74%)', glow: 'hsl(320, 100%, 84%)' },
    { main: 'hsl(180, 100%, 72%)', glow: 'hsl(180, 100%, 82%)' }
];

class Firework {
    constructor(x, y, tx, ty, palette) {
        this.x = x;
        this.y = y;
        this.tx = tx;
        this.ty = ty;
        this.speed = 6;
        this.angle = Math.atan2(ty - y, tx - x);
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.alive = true;
        this.palette = palette;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;

        if (Math.hypot(this.x - this.tx, this.y - this.ty) < 12) {
            this.alive = false;
            for (let i = 0; i < 40; i++) {
                const ang = (Math.PI * 2 / 40) * i;
                particles.push({
                    x: this.x,
                    y: this.y,
                    vx: Math.cos(ang) * (2 + Math.random() * 2),
                    vy: Math.sin(ang) * (2 + Math.random() * 2),
                    alpha: 1,
                    color: Math.random() < 0.5 ? this.palette.main : this.palette.glow
                });
            }
        }
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
    }
}

function loop() {
    if (!fireworkRunning) return;

    ctx.fillStyle = 'rgba(254, 244, 249, 0.14)';
    ctx.fillRect(0, 0, w, h);

    for (let i = fireworks.length - 1; i >= 0; i--) {
        fireworks[i].update();
        fireworks[i].draw();
        if (!fireworks[i].alive) fireworks.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04;
        p.alpha -= 0.018;

        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = p.color.replace(')', `, ${p.alpha})`).replace('hsl', 'hsla');
        ctx.fill();

        if (p.alpha <= 0) particles.splice(i, 1);
    }

    animationId = requestAnimationFrame(loop);
}

function stopFirework() {
    fireworkRunning = false;
    if (animationId) cancelAnimationFrame(animationId);
    if (fireTimer) clearInterval(fireTimer);
    fireTimer = null;
    fireworks = [];
    particles = [];
    ctx.clearRect(0, 0, w, h);
    canvas.style.display = 'none';
}

function launchFire(x, y) {
    const palette = fireworkPalettes[Math.floor(Math.random() * fireworkPalettes.length)];
    fireworks.push(new Firework(w / 2, h, x, y, palette));
}

function startShowFire() {
    if (fireworkRunning || hasFireworkFired) return;
    hasFireworkFired = true;
    fireworkRunning = true;
    canvas.style.display = 'block';
    loop();

    let count = 0;
    const total = 10;
    fireTimer = setInterval(() => {
        const tx = Math.random() * w * 0.6 + w * 0.2;
        const ty = Math.random() * h * 0.3 + h * 0.1;
        launchFire(tx, ty);
        count++;

        if (count >= total) {
            clearInterval(fireTimer);
            fireTimer = null;

            layoutHeartWall();
        }
    });

function layoutHeartWall() {
    const items = heartWall.querySelectorAll('.heart-item');
    const positions = getHeartPositions(items.length);

    items.forEach((item, i) => {
        if (positions[i]) {
            item.style.left = positions[i].x + 'px';
            item.style.top = positions[i].y + 'px';
            item.style.opacity = '0';
            item.style.transform = 'scale(0.6)';

            setTimeout(() => {
                item.style.transition = 'all 0.6s ease';
                item.style.opacity = '1';
                item.style.transform = 'scale(1)';
            }, i * 60);
        }
    });
}

function getHeartPositions(count) {
    const positions = [];
    const cx = 450;
    const cy = 320;
    const totalPoints = count;

    for (let i = 0; i < totalPoints; i++) {
        const t = (Math.PI * 2 / totalPoints) * i;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        const scale = 14;

        positions.push({
            x: cx + x * scale - 41,
            y: cy + y * scale - 41
        });
    }

    return positions;
}

// ========== 蛋糕20根蜡烛 ==========
function createCandle() {
    const cakeBox = document.getElementById('cakeBox');
    cakeBox.querySelectorAll('.candle').forEach(c => c.remove());

    const candleNum = 20;
    const r = 70;
    const cx = 160;
    const cy = 275;

    for (let i = 0; i < candleNum; i++) {
        const angle = (Math.PI * 2 / candleNum) * i;
        const x = cx + Math.cos(angle) * r;
        const candle = document.createElement('div');
        candle.className = 'candle';
        candle.style.left = `${x}px`;
        candle.style.bottom = `${cy}px`;
        candle.innerHTML = `<div class="flame"></div>`;
        cakeBox.appendChild(candle);
    }
}

let collected = 0;

function createStars() {
    collected = 0;
    document.getElementById('starCount').innerText = collected;
    document.getElementById('gameNext').style.display = 'none';

    const area = document.getElementById('starArea');
    area.innerHTML = '';

    for (let i = 0; i < 20; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = `${Math.random() * 90 + 5}%`;
        star.style.top = `${Math.random() * 80 + 5}%`;

        star.onclick = function () {
            if (star.classList.contains('collected')) return;
            star.classList.add('collected');
            collected++;
            document.getElementById('starCount').innerText = collected;

            if (collected >= 20) {
                document.getElementById('gameNext').style.display = 'block';
            }
        };

        area.appendChild(star);
    }
}
